<h1>Clientes</h1>

<button (click)="toggleForm()">Nuevo Cliente</button>

<div *ngIf="showForm()">
  <app-formulario (created)="onCreated($event)"></app-formulario>
</div>

<div *ngIf="loading()">Cargando...</div>
<div *ngIf="error()">Error: {{error()}}</div>

<table *ngIf="!loading()">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Correo</th>
      <th>Telefono</th>
      <th>Fecha Nac.</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of clientes()">
      <td>{{c.IDcliente}}</td>
      <td *ngIf="editingId !== c.IDcliente">{{c.Nombre}}</td>
      <td *ngIf="editingId === c.IDcliente"><input [(ngModel)]="editModel.Nombre" /></td>

      <td *ngIf="editingId !== c.IDcliente">{{c.apellido}}</td>
      <td *ngIf="editingId === c.IDcliente"><input [(ngModel)]="editModel.apellido" /></td>

      <td *ngIf="editingId !== c.IDcliente">{{c.Correo}}</td>
      <td *ngIf="editingId === c.IDcliente"><input [(ngModel)]="editModel.Correo" /></td>

      <td *ngIf="editingId !== c.IDcliente">{{c.Telefono}}</td>
      <td *ngIf="editingId === c.IDcliente"><input [(ngModel)]="editModel.Telefono" /></td>

      <td *ngIf="editingId !== c.IDcliente">{{c.Fecha_Nacimiento | date}}</td>
      <td *ngIf="editingId === c.IDcliente"><input type="date" [(ngModel)]="editModel.Fecha_Nacimiento" /></td>

      <td>
        <button *ngIf="editingId !== c.IDcliente" (click)="startEdit(c)">Editar</button>
        <button *ngIf="editingId === c.IDcliente" (click)="saveEdit(c.IDcliente)">Guardar</button>
        <button *ngIf="editingId === c.IDcliente" (click)="cancelEdit()">Cancelar</button>
        <button (click)="deleteCliente(c.IDcliente)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
