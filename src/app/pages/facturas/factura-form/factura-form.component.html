<div class="card-header bg-success text-white">
    <h4 class="mb-0"><i class="bi bi-receipt-cutoff"></i> Formulario De Facturas</h4>
</div>
<div class="card-body">
    <form [formGroup]="FacturaForm" (ngSubmit)="handleSubmit()">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="ID-Cliente" class="form-label fw-bold">ID Cliente</label>
                <input type="number" 
                             formControlName="IDcliente" 
                             id="ID-Cliente" 
                             class="form-control" 
                           />
            </div>
            <div class="col-md-6">
                <label for="ID-MDP" class="form-label fw-bold">ID MDP</label>
                <input type="number" 
                             formControlName="IDmdp" 
                             id="ID-MDP" 
                             class="form-control" 
                             />
            </div>
            <div class="col-md-6">
                <label for="Total" class="form-label fw-bold">Total</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" 
                                 formControlName="Total" 
                                 id="Total" 
                                 class="form-control" 
                                 />
                </div>
            </div>
            <div class="col-md-6">
                <label for="Fecha" class="form-label fw-bold">Fecha</label>
                <input type="date" 
                             formControlName="Fecha" 
                             id="Fecha" 
                             class="form-control" />
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-check-circle"></i> Crear Factura
                </button>
            </div>
        </div>
    </form>
</div>
